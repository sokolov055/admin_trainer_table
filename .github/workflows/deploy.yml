# Сборка и публикация мини-приложения на GitHub Pages.
#
# Адрес Apps Script лежит в секрете VITE_API_URL (Settings → Secrets and
# variables → Actions). В репозитории его нет: он попадает только в готовую
# сборку, а сам репозиторий публичный.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Все проверки разом, а не выбранные. Выбирать приходилось глазами,
      # и однажды выбор оказался неверным: пропущенный импорт нашёлся
      # только на сборке и на три часа задержал выкладку. «test:e2e» сюда
      # не входит — ему нужен настоящий браузер, он запускается отдельно.
      - run: npm test

      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Хеш коммита вшивается в готовую страницу. Без него нельзя снаружи
      # ответить, что именно сейчас лежит на Pages: имя файла сборки зависит
      # от содержимого и о коммите ничего не говорит. По этой метке
      # проверка расхождения в основном репозитории и видит, отстал ли
      # фронтенд от main.
      - name: Отметить сборку хешем коммита
        run: |
          sed -i "s|</head>|<meta name=\"build-sha\" content=\"${GITHUB_SHA:0:7}\"></head>|" dist/index.html
          grep -o 'build-sha[^>]*' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
