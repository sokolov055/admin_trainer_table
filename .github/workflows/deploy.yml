# Сборка и публикация приложения на нашем сервере (app.fitness100.ru).
#
# С 14.10.2026 сайт живёт на VPS в России: GitHub (США) больше не получает
# IP-адреса пользователей. GitHub Pages с 19.10.2026 не используется: сюда
# больше не выкладываются даже страницы-указатели (scripts/build-moved-site.mjs
# остался на случай возврата).
#
# Сборка уезжает на сервер под ключом WEB_DEPLOY_KEY (секрет репозитория).
# На сервере этот ключ умеет только одно — принять архив сборки
# (server/deploy/web-receive.sh в основном репозитории): ни входа в
# консоль, ни других команд.
#
# Адрес API по умолчанию лежит в секрете VITE_API_URL (Settings → Secrets and
# variables → Actions): с 24.10.2026 — https://api.fitness100.ru (раньше был
# Apps Script). Основной адрес приложение берёт из public/config.json, этот —
# только если config.json не загрузился.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Все проверки разом, а не выбранные. Выбирать приходилось глазами,
      # и однажды выбор оказался неверным: пропущенный импорт нашёлся
      # только на сборке и на три часа задержал выкладку. «test:e2e» сюда
      # не входит — ему нужен настоящий браузер, он запускается отдельно.
      - run: npm test

      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Хеш коммита вшивается в готовую страницу. Без него нельзя снаружи
      # ответить, что именно сейчас лежит на сайте: имя файла сборки зависит
      # от содержимого и о коммите ничего не говорит. По этой метке
      # проверка расхождения в основном репозитории и видит, отстал ли
      # фронтенд от main.
      - name: Отметить сборку хешем коммита
        run: |
          sed -i "s|</head>|<meta name=\"build-sha\" content=\"${GITHUB_SHA:0:7}\"></head>|" dist/index.html
          grep -o 'build-sha[^>]*' dist/index.html

      # Архива экранов для iPhone (app/web.json) здесь больше нет и не должно
      # быть: Apple отклонила приложение по правилу 2.5.2 (30.09.2026) за то,
      # что оно скачивало экраны с сайта. Экраны на iPhone меняются только
      # новой сборкой (mobile/prepare-ios.sh). Старые тестовые сборки без
      # web.json просто перестают обновляться.

      - name: Выложить на app.fitness100.ru
        env:
          KEY: ${{ secrets.WEB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/web_deploy
          chmod 600 ~/.ssh/web_deploy
          # Ключ сервера закреплён: подменённый сервер сборку не получит
          echo '139.100.217.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ010Mkp9uk2T/Al8mlWTelyZRK/03iTFg4CEJJxx3Os' > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -i ~/.ssh/web_deploy -o BatchMode=yes webdeploy@139.100.217.92 "${GITHUB_SHA:0:7}"
          rm -f ~/.ssh/web_deploy

      - name: Проверить, что доехало
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -s --max-time 20 "https://app.fitness100.ru/?t=$(date +%s)" | grep -oE 'build-sha" content="[0-9a-f]+' | grep -oE '[0-9a-f]+$' || true)
            [ "$live" = "${GITHUB_SHA:0:7}" ] && { echo "На app.fitness100.ru: $live"; exit 0; }
            sleep 5
          done
          echo "На app.fitness100.ru не та сборка: '$live'" >&2
          exit 1
