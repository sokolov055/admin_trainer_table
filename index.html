    <!-- Код страницы не загрузился (24.10.2026): сервис-воркер отдал прежнюю
         страницу, а её index-<хеш>.js на сервере уже нет — приложение висело
         на «Загружаем кабинет…». Один раз за сеанс: забыть сохранённую копию
         и открыть заново. Без сети не трогаем — копия нужна для работы без
         интернета. Старый JS: бандла здесь ещё нет -->
    <script>
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || el.tagName !== 'SCRIPT' || !/\/assets\/[^\/]+\.js/.test(el.src || '')) return;
        if (navigator.onLine === false) return;
        try { if (sessionStorage.getItem('boot-retry')) return; sessionStorage.setItem('boot-retry', '1'); } catch (_) { return; }
        var go = function () { var u = new URL(location.href); u.searchParams.set('r', String(Date.now())); location.replace(u.href); };
        var jobs = [];
        try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (_) {}
        try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (_) {}
        Promise.all(jobs).then(go, go);
      }, true);
    </script>

    <!-- Шрифт интерфейса (FT-665) — сразу, вместе с оболочкой: иначе браузер

         шрифтом, а потом перескакивает. Свои файлы из public/fonts, не
         Google Fonts. crossorigin обязателен: шрифт из CSS грузится в
         режиме CORS, и без него предзагрузка не совпала бы и шла впустую. -->
    <link rel="preload" href="fonts/roboto-cyrillic.woff2" as="font" type="font/woff2" crossorigin />

         полосы, и iPhone красил её сам, под верхний край страницы, — при
         открытом меню серой полосой над белой панелью.
         Плата известна и принята: часы iPhone в этом режиме всегда
         белые, и в светлой теме на светлом фоне читаются плохо. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Заставка при холодном запуске (FT-750): знак-график превращается в
         сборную гантель, снизу — «Fit Track». Только в приложении из
         магазина и на установленном сайте; в браузере и при перезагрузке её
         нет (скрипт сразу после разметки). Цвета фирменные, как у иконки, а
         не темы: нативная заставка iPhone и Android тему не знает, а первый
         кадр должен совпасть с ней точь-в-точь — знак 104 × 111 в центре
         (mobile/gen_icons.py рисует его тем же размером).
         Всё — CSS-анимация: она идёт мимо главного потока и не дёргается,
         пока грузится и разбирается бандл. Числа — координаты иконки 512:
         ось гантели y=440, столбики — верхние половины блинов. -->
    <style>
      @font-face { font-family: 'FT Splash'; src: url('site/fonts/manrope-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
      /* Пока идёт заставка, сама страница — её цвета. Приложение с экрана
         «Домой» iPhone на старте не дотягивает окно до низа экрана, и в
         полосе под ним просвечивал фон темы (бордовый «Хэллоуин»,
         28.10.2026). !important: после загрузки стили темы красят корень
         сильнее (:root[data-palette]) */
      :root.splash-on { background: #232726 !important; }
      /* iOS 26, сайт с экрана «Домой» (WebKit 301108, 28.10.2026): странице,
         которая при первом кадре не выше экрана, дают окно короче экрана на
         высоту строки состояния. В полосу под ним страница не рисует — там
         на кадр мелькает прошлый экран, а всё, что стоит «по центру окна»,
         потом съезжает. Корень не ниже экрана — и окно дают целиком; 100lvh
         сверху, чтобы потом нечего было прокручивать (WebKit 316008) */
      @media (display-mode: standalone) {
        html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); }
      }
      .splash {
        --sp-bg: #232726; --sp-cream: #ede8dd; --sp-green: #4e9d69; --sp-steel: #a3aaa7;
        /* Середина экрана. На iPhone с экрана «Домой» скрипт ниже ставит её в
           пикселях по высоте экрана: окно на первых кадрах короче экрана,
           и знак по 50 % окна стоял выше картинки запуска, а потом прыгал */
        --sp-mid: 50%;
        --sp-out: cubic-bezier(0.23, 1, 0.32, 1); --sp-move: cubic-bezier(0.77, 0, 0.175, 1);
        position: fixed; inset: 0; z-index: 2147483000; background: var(--sp-bg);
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        /* Страховка без JS: что бы ни случилось со скриптом, через 6 с заставка не мешает */
        animation: sp-gone 1ms linear 6s forwards;
      }
      /* Гантель 1050 × 742 единицы → 200 px; знак-график в начале — 0,3 px на
         единицу (те же 104 px), отсюда масштаб 1,575. В конце гантель на
         34 px выше центра, чтобы вместе с названием стоять посередине */
      .splash__rig-svg { position: absolute; left: 50%; top: var(--sp-mid); width: 200px; height: 141.33px; margin: -70.67px 0 0 -100px; overflow: visible; }
      .splash__rig, .splash__plate { transform-box: view-box; transform-origin: 0 0; }
      .splash__rig { transform: translate(248.59px, 39.16px) scale(1.575); }
      .splash__part { transform-box: fill-box; }
      .splash__low { transform-origin: 50% 0; transform: scaleY(0); }
      .splash__grow-y { transform-origin: 50% 50%; transform: scaleY(0); }
      .splash__grow-r { transform-origin: 0 50%; transform: scaleX(0); }
      .splash__grow-l { transform-origin: 100% 50%; transform: scaleX(0); }
      .splash__word {
        position: absolute; left: 0; right: 0; top: calc(var(--sp-mid) + 65px); margin: 0; text-align: center;
        font: 760 40px/1 'FT Splash', 'Roboto', system-ui, sans-serif; letter-spacing: -0.035em;
        color: var(--sp-cream); opacity: 0;
      }
      /* Точка над «i» — зелёная точка загрузки: «ı» без точки, своя падает на
         место родной (замер по Manrope 760: середина ножки 0,14 em от начала
         буквы, верх ножки 0,34 em от верха строки) и дышит, пока приложение
         догружается */
      .splash__i { position: relative; display: inline-block; }
      .splash__dot {
        position: absolute; left: 0.057em; top: 0.11em; width: 0.165em; height: 0.165em; border-radius: 50%;
        background: var(--sp-green); opacity: 0; transform: translateY(-0.4em) scale(0.6);
      }
      .splash--go .splash__dot { animation: sp-dot 380ms var(--sp-out) 1260ms forwards, sp-breathe 900ms ease-in-out 1640ms infinite; }
      .splash--go .splash__rig { animation: sp-camera 900ms var(--sp-move) 140ms forwards; }
      .splash--go .splash__low { animation: sp-open-y 380ms var(--sp-out) forwards; }
      .splash--go .splash__low--1 { animation-delay: 140ms; }
      .splash--go .splash__low--2 { animation-delay: 180ms; }
      .splash--go .splash__low--3 { animation-delay: 220ms; }
      .splash--go .splash__p1 { animation: sp-plate-1 440ms var(--sp-move) 220ms forwards; }
      .splash--go .splash__p2 { animation: sp-plate-2 440ms var(--sp-move) 220ms forwards; }
      .splash--go .splash__p3 { animation: sp-plate-3 440ms var(--sp-move) 220ms forwards; }
      .splash--go .splash__grow-y { animation: sp-open-y 360ms var(--sp-out) forwards; }
      .splash--go .splash__grow-r, .splash--go .splash__grow-l { animation: sp-open-x 360ms var(--sp-out) forwards; }
      .splash--go .splash__ic-l { animation-delay: 460ms; }
      .splash--go .splash__handle { animation-delay: 500ms; animation-duration: 340ms; }
      .splash--go .splash__c-l { animation-delay: 560ms; }
      .splash--go .splash__s-l { animation-delay: 600ms; }
      .splash--go .splash__ic-r { animation-delay: 700ms; }
      .splash--go .splash__r3 { animation-delay: 720ms; }
      .splash--go .splash__r2 { animation-delay: 780ms; }
      .splash--go .splash__r1 { animation-delay: 840ms; }
      .splash--go .splash__c-r { animation-delay: 890ms; }
      .splash--go .splash__s-r { animation-delay: 930ms; }
      .splash--go .splash__word { animation: sp-rise 460ms var(--sp-out) 1020ms forwards; }
      .splash--out { animation: sp-fade 380ms var(--sp-out) forwards; pointer-events: none; }
      .splash--out .splash__rig-svg { animation: sp-lift 380ms var(--sp-out) forwards; }
      @keyframes sp-camera { to { transform: translate(0, -178.5px) scale(1); } }
      @keyframes sp-open-y { to { transform: scaleY(1); } }
      @keyframes sp-open-x { to { transform: scaleX(1); } }
      /* Столбик x0, w0 → блин x1, w1: translateX(x1 − k·x0) scaleX(k), k = w1 / w0 */
      @keyframes sp-plate-1 { to { transform: translateX(162.64px) scaleX(0.5532); } }
      @keyframes sp-plate-2 { to { transform: translateX(133.23px) scaleX(0.6383); } }
      @keyframes sp-plate-3 { to { transform: translateX(92.43px) scaleX(0.7216); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 0; } }
      @keyframes sp-lift { to { transform: translateY(-14px) scale(1.04); } }
      @keyframes sp-dot { to { opacity: 1; transform: none; } }
      @keyframes sp-breathe { 0%, 100% { opacity: 1; transform: none; } 50% { opacity: 0.4; transform: scale(0.8); } }
      @keyframes sp-gone { to { visibility: hidden; pointer-events: none; } }
      /* «Уменьшить движение»: сразу готовая гантель с названием, уход — растворением */
      @media (prefers-reduced-motion: reduce) {
        .splash.splash--go *, .splash.splash--out * { animation: none !important; }
        .splash--go .splash__rig { transform: translate(0, -178.5px); }
        .splash--go .splash__low, .splash--go .splash__grow-y, .splash--go .splash__grow-r, .splash--go .splash__grow-l { transform: none; }
        .splash--go .splash__p1 { transform: translateX(162.64px) scaleX(0.5532); }
        .splash--go .splash__p2 { transform: translateX(133.23px) scaleX(0.6383); }
        .splash--go .splash__p3 { transform: translateX(92.43px) scaleX(0.7216); }
        .splash--go .splash__word, .splash--go .splash__dot { opacity: 1; transform: none; }
        .splash.splash--out { animation: sp-fade 240ms ease forwards; }
      }
    </style>
    <!-- ПЕРВЫМ ДЕЛОМ сохраняем фрагмент адреса.
         Telegram передаёт в нём подпись (tgWebAppData), а SDK при запуске
         вычищает адрес через history.replaceState. Если наш код прочитает
         фрагмент позже SDK, читать будет уже нечего — и приложение решит,
         что его открыли не из мессенджера.
         Поэтому забираем строку до того, как выполнится что-либо ещё. -->
    <script>
      (function () {
        try {
          var h = window.location.hash || '';
          if (h.indexOf('tgWebApp') !== -1) {
            window.__tgLaunchHash = h;
            sessionStorage.setItem('tg_launch_hash', h);
          }
        } catch (e) {}
      })();
    </script>

    <!-- SDK Telegram — СВОЯ копия и с defer.
         Раньше здесь стоял блокирующий тег на telegram.org, а локальная
         копия подхватывалась только через onerror. Это значило, что ни
         одна точка на экране не рисуется, пока браузер не сходит на чужой
         домен, — а если он у провайдера медленный или режется, ждём полный
         таймаут и только потом берём файл, который всё это время лежал
         рядом. Для приложения, запущенного с рабочего стола, этот запрос —
         чистый вычет: с 21.09 вход клиента идёт по ссылке, а на телефоне
         подпись Telegram приезжает во фрагменте адреса и SDK не нужен.
         SDK остаётся ради настольного клиента, где фрагмент бывает пустым
         и подпись живёт только внутри него. defer сохраняет порядок:
         скрипт выполнится до модуля приложения, но рисовать не помешает.
         Плата — версия SDK обновляется вместе с приложением, а не сама. -->
    <script src="telegram-web-app.js" defer></script>
  </head>

    <!-- Показывать ли заставку и когда убрать (FT-750). Холодный запуск
         приложения из магазина или с экрана «Домой»; в браузере, в Telegram и
         при перезагрузке страницы — нет (флаг в sessionStorage живёт до
         выгрузки страницы и умирает вместе с приложением). Порядок:
         1) первый кадр — готовый знак, как нативная заставка;
         2) нативную заставку снимаем, когда наш кадр уже нарисован, —
            без мигания (её держит @capacitor/splash-screen, запас 2,5 с);
         3) анимация 1,5 с и короткая пауза на готовой гантели; уходим, когда она доиграла и приложение
            нарисовало экран (не скелет загрузки), но не позже 4 с;
         4) касание пропускает. Старый JS: бандла здесь ещё нет. -->
    <script>
      (function () {
        var el = document.getElementById('splash');
        var root = document.documentElement;
        var cap = window.Capacitor;
        function nativeSplash() {
          try {
            if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return null;

    <!-- Заглушка до запуска приложения. React заменит её первым же кадром.
         Без неё медленная сеть или браузер, который не смог выполнить
         бандл, выглядели как белый лист — клиенты так и говорили: «ссылка
         не грузится». Теперь видно, что идёт загрузка, а если через
         двенадцать секунд приложение так и не запустилось, есть выход:
         открыть ту же ссылку в Safari или в браузере. Всё здесь — только
         встроенные стили и старый JS: бандла и CSS к этому моменту может
         не быть вовсе. -->
    <div id="root"><div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#8a8790;text-align:center"><div>Загружаем кабинет…</div><div id="boot-slow" hidden style="max-width:320px"><p style="margin:0 0 10px">Долго не открывается? Если включён VPN — выключите его и откройте приложение заново: через VPN сервер часто недоступен.</p><p style="margin:0 0 14px">Не помогло — скопируйте ссылку и откройте её в Safari (на iPhone) или в Chrome.</p><button id="boot-copy" type="button" style="font:inherit;padding:12px 18px;border-radius:12px;border:1px solid #8a879066;background:transparent;color:inherit">Скопировать ссылку</button></div></div></div>
    <script>
      (function () {
        setTimeout(function () {
          var slow = document.getElementById('boot-slow');
          if (!slow) return; // приложение уже нарисовалось
          slow.hidden = false;
          var btn = document.getElementById('boot-copy');
          btn.onclick = function () {
            var href = window.location.href;
            var done = function () { btn.textContent = 'Ссылка скопирована'; };
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(href).then(done, function () { window.prompt('Скопируйте ссылку:', href); });
                return;
              }
            } catch (e) {}
            window.prompt('Скопируйте ссылку:', href);
          };
        }, 12000);
      })();
    </script>
